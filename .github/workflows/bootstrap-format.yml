name: Format dense React pages

on:
  push:
    branches: [remediation/security-reliability]
    paths:
      - src/pages/EstimatesPage.tsx
      - src/pages/PartiesPage.tsx
      - src/pages/financial-workflows.test.tsx
      - .github/workflows/bootstrap-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format pages
        run: npx --yes prettier@3.6.2 --write src/pages/EstimatesPage.tsx src/pages/PartiesPage.tsx src/pages/financial-workflows.test.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/EstimatesPage.tsx src/pages/PartiesPage.tsx src/pages/financial-workflows.test.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format estimates and parties pages"
          git push
