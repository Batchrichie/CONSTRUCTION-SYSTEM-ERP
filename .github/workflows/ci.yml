name: CI

on:
  push:
    branches: [main, 'phase-**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
