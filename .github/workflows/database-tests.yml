name: Database Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'phase-**']

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: Supabase migration, pgTAP and concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Run database regression tests
        run: supabase test db

      - name: Run two-session estimate transition concurrency test
        run: bash scripts/test-estimate-workflow-concurrency.sh

      - name: Run two-session duplicate journal posting test
        run: bash scripts/test-journal-posting-concurrency.sh
